const ART={moon:[
{name:"Apollo 15 Lunar Module Falcon (1971)",x:0,z:26,color:0xd9a93a,shape:"falcon",glb:"",site:"Hadley–Apennine, Moon",lat:26.13,lon:3.63,y0:1971,cov:.5,
made:"A lunar module has two stages: a descent stage that carries the astronauts to the surface and stays there, and an ascent stage that returns them to lunar orbit.",
mission:"Apollo 15 launched in July 1971. It focused on geological research, and with the Lunar Roving Vehicle the astronauts explored a much wider area of the Moon and deployed the ALSEP science station.",
left:"The descent stage was left on the Moon with the rover, the ALSEP station and the Fallen Astronaut sculpture. The ascent stage returned the astronauts to lunar orbit and was then separated from the mission.",
en:"I am Falcon, the Apollo 15 lunar module. Apollo 15 launched in July 1971 and focused on geological research. My descent stage carried the astronauts to the surface. It stayed on the Moon after the mission. My ascent stage returned them to lunar orbit before it was separated from the mission.",
kids:"Hi! I am Falcon, a moon lander! I carried astronauts down to the Moon in 1971. My bottom half stayed on the Moon. My top half flew them back up to space!",
facts:["The astronauts drove about 27.9 kilometres with the Lunar Roving Vehicle, and left it on the Moon.","The ALSEP science station began operating on 31 July 1971, and NASA shut the ALSEP stations down in September 1977.","The Fallen Astronaut sculpture sits beside a plaque for 14 American and Soviet astronauts and cosmonauts who died in space exploration.","ALSEP was powered by SNAP-27, which turns heat from the natural decay of plutonium-238 into electricity."],

{name:"Surveyor 3 (1967)",x:-20,z:24,color:0xcfd3da,shape:"surv",glb:"",site:"Oceanus Procellarum, Moon",lat:-3.01,lon:-23.42,y0:1967,cov:.5,
made:"Built by NASA and JPL in the United States: a lander of 2,200 pounds (997.9 kilograms), equipped with a TV camera and a surface sampler.",

left:"Its last contact was on 4 May 1967. On 19 November 1969 Apollo 12 astronauts Charles Conrad Jr. and Alan L. Bean landed the lunar module Intrepid about 180 metres away, and on their second moonwalk recovered its soil scoop and camera system to study long-term exposure on the Moon.",
en:"I am Surveyor 3, a NASA and JPL lander built to make a soft landing on the Moon. I launched on 17 April 1967 and landed on 20 April in Oceanus Procellarum. Shiny rocks confused my descent radar, so my engines did not cut off in time and I bounced twice before settling. Less than an hour later I began sending thousands of TV pictures. My last contact was on 4 May 1967. In 1969, Apollo 12 astronauts walked over and took my scoop and camera home.",
kids:"Hi! I am Surveyor 3, a robot that landed on the Moon! I bounced twice before I stopped. I took thousands of pictures. Later, astronauts visited me and took my scoop home!",
facts:["Highly reflective rocks confused my descent radar, so my main engines did not cut off at the correct altitude, and I bounced off the surface twice.","My trenches and bearing tests showed the lunar soil is like wet sand, strong enough to support an Apollo lunar module.","I carried a TV camera and a surface sampler, and I weighed 2,200 pounds, about 998 kilograms.","Apollo 12 landed the lunar module Intrepid about 180 metres from me on 19 November 1969.","Conrad and Bean brought home my soil scoop and camera system so scientists could study long exposure on the Moon."],
blind:"A light lander with a triangular frame of metal tubes, standing on three splayed legs with round footpads. A short central mast carries a TV camera, a small solar panel and a flat antenna. Below the frame is a round rocket motor, and one side has a thin arm with a small scoop for sampling soil. It landed in April 1967, and Apollo 12 astronauts visited it in 1969."}],
mars:[
{name:"Viking 1 Lander (1976–1982)",x:6,z:25,color:0xc4c9d2,shape:"viking",glb:"",site:"Chryse Planitia, Mars",lat:22.48,lon:312.06,y0:1976,cov:.8,sc:1.4,
made:"Built by NASA with Langley and JPL: a 978 kg lander with two cameras, a robot sampling arm, a biology lab, a gas chromatograph mass spectrometer, a weather station and two RTG nuclear power units. It rode to Mars with a 2,339 kg orbiter.",
mission:"Launched on 20 August 1975 on a Titan IIIE-Centaur, it entered Mars orbit on 19 June 1976 and landed on 20 July 1976, the first fully successful Mars landing.",
left:"A faulty command from Earth ended contact on 11 November 1982. It was renamed the Thomas Mutch Memorial Station.",
en:"I am Viking 1, the first successful lander on Mars. I touched down on 20 July 1976 on Chryse Planitia. I took the first photos from the surface and scooped soil to search for life. My tests found no organic compounds, so the question stayed open. I worked until 11 November 1982, when a faulty command cut my link.",
kids:"Hi! I am Viking, the first robot that really worked on Mars! I landed in 1976. I took the very first photo from the ground. I dug up Mars dirt with my arm to look for tiny life. I did not find any, but I taught us so much!",
facts:["The first photo ever taken on the surface of Mars came minutes after I landed. I also took a 300-degree panorama.","The Soviet Mars 3 landed in 1971 but lost contact in seconds. That is why I count as the first truly successful landing.","Before landing, the orbiter showed my first target was too rough, so I landed 28 kilometres away on Chryse Planitia, on the western slope.","On 28 July 1976 my arm scooped the first soil into my biology lab. The test for organic compounds was negative.","I measured minus 86 degrees Celsius before dawn and minus 33 in the afternoon, and I found lots of sulfur in the soil.","With Viking 2, our orbiters returned 52,663 images and mapped about 97 percent of Mars. Landers sent 4,500 photos.","My seismometer did not work, so I could not listen for marsquakes.","Two RTG nuclear batteries powered me. My orbiter ran out of steering gas in 1980 after 1,489 orbits."],
blind:"A hexagonal silver-grey body about the size of a small table, wrapped in gold foil underneath, standing on three thin legs with round footpads. On top: a small dish antenna on a pole, two cylindrical nuclear power units, two camera towers, a long thin sampler arm reaching out at the front, and a weather boom at the back. It landed on 20 July 1976 and stopped talking on 11 November 1982."},
{name:"Viking 1 Orbiter (1975–1980)",x:-7,z:25,color:0xc9cdd5,shape:"vorb",glb:"",site:"Mars orbit (museum replica)",lat:22.48,lon:312.06,y0:1976,cov:.3,sc:.75,

left:"On 7 August 1980 it was shut down after running out of attitude-control propellant on its 1,489th orbit.",
en:"I am the Viking 1 orbiter. I entered Mars orbit on 19 June 1976 and scouted the landing site. My photos showed the first target was too rough, so my lander went somewhere new. Together with Viking 2 our orbiters returned 52,663 images and mapped about 97 percent of Mars. I went quiet on 7 August 1980, after my steering gas ran out on orbit 1,489.",
kids:"Hi! I am the Viking orbiter. I flew around Mars again and again and took thousands of pictures. I helped pick a safe place to land. After 1,489 laps I ran out of steering gas and took a rest!",
facts:["My design borrowed heavily from the Mariner spacecraft.","The first spacecraft had discharged batteries before launch, so the second one was launched as Viking 1.","I made three course corrections before entering orbit.","My photos of Chryse showed it was rougher than expected, so the lander was sent to the western slopes instead.","My orbiter and Viking 2's returned 52,663 images, at about 300 metres per pixel."],
blind:"A wide spacecraft with an eight-sided silver body, four long solar-panel arms each made of two flat panels, two white propellant tanks on top with a rocket engine, a large dish antenna, a tall thin antenna mast, and a camera platform hanging underneath."},
{name:"Ingenuity Mars Helicopter (2021–2024)",x:-21,z:19,color:0xe3d9bf,shape:"heli",glb:"",facts:["I was the first aircraft to achieve powered, controlled flight on another planet, a feat called a Wright Brothers moment.","I flew 72 times for about 128.8 minutes, covering about 17 kilometres and reaching 24 metres high.","I was designed for no more than five test flights in 30 days, but I kept flying for nearly three years.","My solar panel charged my lithium-ion batteries, enough energy for one 90-second flight per Martian day.","The air I flew in is less than 1 percent as dense as Earth air.","My top ground speed was about 10 metres per second, or 22.4 miles per hour."],site:"Jezero Crater, Mars",lat:18.44,lon:77.45,y0:2021,cov:.7,sc:2.6,

en:"I am Ingenuity, the first aircraft to fly on another planet. I arrived with Perseverance in 2021, planned for five flights, and I flew seventy-two. In 2024 my rotor blades were damaged, so I was retired. I still stand in Jezero Crater.",
kids:"Whirr! I am Ingenuity, a tiny helicopter on Mars! I have two spinning blades that turn in opposite directions. I was supposed to fly five times, but I flew seventy-two! Hooray!",
blind:"A tiny helicopter standing on four long slanted legs with small foot pads. A small silver foil-wrapped box is the body. Above it two long thin dark carbon-fibre rotors are stacked one over the other, topped by a flat solar panel with a thin antenna. It made the first powered flight on another planet in April 2021, flew 72 times, and completed its mission in January 2024.",

const AR={surv:{n:"سيرفيور 3 (1967)",w:"أنا سيرفيور 3، مركبة هبوط من ناسا ومختبر JPL صُنعت لتهبط هبوطاً ناعماً على القمر.",m:"صنعتها ناسا ومختبر JPL: مركبة هبوط كتلتها 2,200 رطل (997.9 كغ) مزودة بكاميرا تلفزيونية وجهاز لأخذ عينات السطح.",k:"كان هدفها هبوطاً ناعماً على القمر. أُطلقت في 17 أبريل 1967 وهبطت في 20 أبريل 1967 في منطقة محيط العواصف.",l:"آخر اتصال بها كان في 4 مايو 1967. وفي 19 نوفمبر 1969 هبط رائدا أبولو 12 تشارلز كونراد وآلان بين بالمركبة القمرية إنتريبيد على بعد نحو 180 متراً منها، وفي سيرهما الثاني أخذا مجرفة التربة ونظام الكاميرا لدراسة أثر التعرض الطويل.",b:"مركبة هبوط خفيفة بهيكل ثلاثي من أنابيب معدنية على ثلاث أرجل منفرجة بأقدام دائرية. في الوسط صارٍ قصير يحمل كاميرا تلفزيونية ولوحاً شمسياً صغيراً وهوائياً مسطحاً، وتحت الهيكل محرك صاروخي دائري، وعلى جانب ذراع رفيعة بمجرفة صغيرة لأخذ التربة.",f:["أربكت صخور شديدة الانعكاس رادار هبوطي فارتددت عن السطح مرتين.","أظهرت خنادقي واختبارات التحمل أن التربة القمرية كالرمل الرطب وتتحمل مركبة أبولو.","حملت كاميرا تلفزيونية وجهاز عينات وكانت كتلتي نحو 998 كغ.","هبطت إنتريبيد على بعد نحو 180 متراً مني في 19 نوفمبر 1969.","أحضر كونراد وبين مجرفتي ونظام الكاميرا لدراسة التعرض الطويل على القمر."]},
falcon:{n:"المركبة القمرية فالكون، أبولو 15 (1971)",w:"أنا فالكون، المركبة القمرية لمهمة أبولو 15، أُطلقت في يوليو 1971.",m:"للمركبة القمرية مرحلتان: هابطة تحمل الروّاد إلى السطح وتبقى هناك، وصاعدة تعيدهم إلى مدار القمر.",k:"ركزت أبولو 15 على البحث الجيولوجي، وبفضل المركبة الجوالة استكشف الروّاد منطقة أوسع بكثير ونشروا محطة ALSEP العلمية.",l:"بقيت المرحلة الهابطة على القمر مع المركبة الجوالة ومحطة ALSEP ومنحوتة رائد الفضاء الساقط، أما الصاعدة فأعادت الروّاد إلى المدار ثم انفصلت عن المهمة.",b:"مركبة هبوط على شكل صندوق زاوي. المرحلة الهابطة ملفوفة برقائق ذهبية على أربع أرجل مائلة تنتهي بأقدام دائرية، وفوقها مرحلة صاعدة أصغر بنوافذ وهوائيات ومحركات صغيرة.",f:["قطع الروّاد بالمركبة الجوالة نحو 27.9 كم وتركوها على القمر.","بدأت محطة ALSEP العمل في 31 يوليو 1971 وأوقفتها ناسا في سبتمبر 1977.","تجلس منحوتة رائد الفضاء الساقط بجانب لوحة تكرّم 14 رائد فضاء ماتوا أثناء استكشاف الفضاء.","تعمل المحطة بمولّد SNAP-27 الذي يحوّل حرارة تحلل البلوتونيوم-238 إلى كهرباء."]},
rover:{n:"مركبة القمر الجوالة LRV (أبولو 15، 1971)",w:"أنا المركبة القمرية الجوالة؛ حملت رائدين في أبولو 15 عام 1971 وقطعت نحو 28 كم.",m:"صنعتها بوينغ وجنرال موتورز؛ عجلاتها من أسلاك فولاذية مجدولة، ولكل عجلة محرك كهربائي ببطاريات غير قابلة للشحن.",k:"استخدمها ديفيد سكوت وجيمس إروين قرب وادي هادلي في يوليو 1971 بسرعة قصوى نحو 13 كم/س.",l:"تُركت لأن وزن العودة محدود، وركنها سكوت لتصوّر كاميرتها الإقلاع، وما زالت هناك.",b:"مركبة صغيرة مفتوحة، هيكل رمادي منخفض، مقعدان متجاوران، أربع عجلات من شبك سلكي، وفي المقدمة هوائي دائري كالمظلة على سارية."},
lander:{n:"المرحلة الهابطة لمركبة أبولو 11 (1969)",w:"أنا قاعدة المركبة إيجل؛ هبطت بأول بشر على القمر في 20 يوليو 1969 ثم بقيت منصة لإقلاعهم.",m:"بنتها غرومان: هيكل ثماني الأضلاع مغلّف برقائق ذهبية وأربع أرجل بأقدام عريضة.",k:"هبطت في بحر الهدوء وسار عليه أرمسترونغ وألدرين، ثم أصبحت منصة إطلاق مرحلة الصعود.",l:"تُركت لتخفيف الوزن، وما زالت في قاعدة الهدوء وعلى إحدى أرجلها لوحة تذكارية.",b:"قاعدة ثمانية الأضلاع ملفوفة برقائق ذهبية لامعة على أربع أرجل مائلة تنتهي بأقدام دائرية عريضة."},
seismo:{n:"مقياس الزلازل القمري PSE (أبولو 11)",w:"أنا أذن القمر؛ أنصت لزلازله منذ 1969.",m:"أسطوانة بعزل ذهبي بحساسات دقيقة، تغذّيها ألواح شمسية وترسل بياناتها إلى الأرض.",k:"وضعه رواد أبولو 11 ليسجل الزلازل القمرية، وأكملت أجهزة أبولو 12 و14 و15 و16 الصورة وكشفت أن للقمر قشرة ووشاحاً ونواة.",l:"عمل نحو 21 يوماً ثم أنهاه برد الليل القمري.",b:"أسطوانة قصيرة ذهبية بلوح شمسي مائل وهوائي رفيع."},
opp:{n:"المركبة الجوالة أوبورتيونيتي (2004–2018)",w:"أنا أوبورتيونيتي؛ خُطط لي 90 يوماً فاستمررت نحو 14 عاماً.",m:"بنتها ناسا في JPL: ست عجلات وألواح شمسية عريضة وصارٍ للكاميرات.",k:"هبطت في ميريديياني يوم 25 يناير 2004 وقطعت أكثر من 45 كم وكشفت أدلة على ماء قديم.",l:"انقطع الاتصال بها في يونيو 2018 بسبب عاصفة غبار حجبت الشمس، وأنهت ناسا المهمة في فبراير 2019.",b:"مركبة بحجم عربة غولف، ظهر عريض مسطح بألواح شمسية زرقاء، ست عجلات، وصارٍ بكاميرات."},
heli:{n:"المروحية إنجينيويتي (2021–2024)",w:"أنا إنجينيويتي، أول طائرة حلّقت على كوكب آخر، وطرت 72 مرة.",m:"مروحية 1.8 كغ بدوّارين متعاكسين من ألياف الكربون بقطر 1.2 م، يدوران نحو 2400 دورة في الدقيقة.",k:"وصلت مع المثابرة في فبراير 2021، وفي 19 أبريل 2021 نفّذت أول طيران مُتحكَّم به على كوكب آخر.",l:"تضررت شفراتها في يناير 2024 فتقاعدت، وما زالت في فوهة جيزيرو.",b:"مروحية صغيرة على أربع أرجل طويلة مائلة بأقدام صغيرة. جسمها صندوق فضي صغير ملفوف برقائق، وفوقه دوّاران طويلان رفيعان داكنان من ألياف الكربون أحدهما فوق الآخر، وفوقهما لوح شمسي مسطح وهوائي رفيع.",f:["كانت أول طائرة تحقق طيراناً بمحرك ومُتحكَّماً به على كوكب آخر، وسُمّي ذلك لحظة الأخوين رايت.","حلّقت 72 مرة لنحو 128.8 دقيقة وقطعت نحو 17 كم وبلغت ارتفاع 24 متراً.","صُممت لخمس رحلات تجريبية على الأكثر خلال 30 يوماً لكنها واصلت الطيران قرابة ثلاث سنوات.","شحن لوحها الشمسي بطارياتها الليثيوم أيون وكفى لرحلة واحدة مدتها 90 ثانية في اليوم المريخي.","الهواء الذي طارت فيه أقل من 1% من كثافة هواء الأرض.","بلغت أقصى سرعة لها على الأرض نحو 10 م/ث أي 22.4 ميل/س."]},
viking:{n:"مركبة فايكنغ 1 الهابطة (1976–1982)",w:"أنا فايكنغ 1، أول مركبة هبطت بنجاح كامل على المريخ في 20 يوليو 1976.",m:"بنتها ناسا مع لانغلي وJPL، وزنها 978 كغ: كاميرتان وذراع جمع عينات ومختبر أحياء وجهاز GCMS ومحطة طقس ومولّدا طاقة نووية RTG.",k:"أُطلقت في 20 أغسطس 1975، ودخلت مدار المريخ في 19 يونيو 1976، وهبطت في 20 يوليو 1976 على سهل كريسي.",l:"انقطع الاتصال في 11 نوفمبر 1982 بسبب أمر خاطئ من الأرض، وسُمّيت محطة توماس ماتش التذكارية.",b:"جسم سداسي رمادي منخفض على ثلاث أرجل بأقدام دائرية، فوقه طبق هوائي، وغطاءان أسطوانيان للمولّدات النووية، وبرجا كاميرات، وذراع طويلة رفيعة لجمع التربة.",f:["أول صورة التُقطت من سطح المريخ كانت بعد دقائق من الهبوط، مع بانوراما 300 درجة.","مركبة مارس 3 السوفييتية هبطت عام 1971 لكن الاتصال انقطع بعد ثوانٍ، لذلك أُعدّ أول هبوط ناجح.","في 28 يوليو 1976 جمعت ذراعي التربة، وكان اختبار المركّبات العضوية سلبياً.","قسْت حرارة -86 م قبل الفجر و-33 م عصراً، ووجدت كبريتاً وفيراً.","جهاز الزلازل لدي كان معطلاً."]},
vorb:{n:"مدارية فايكنغ 1 (1975–1980)",w:"أنا مدارية فايكنغ 1؛ دخلت مدار المريخ في 19 يونيو 1976.",m:"وزنها 2,339 كغ وتعمل بالطاقة الشمسية، بكاميرتين وجهازين للأشعة تحت الحمراء.",k:"صوّرت موقع الهبوط فتبيّن أنه وعر، فتغيّر الهدف، ثم رسمت خريطة للمريخ.",l:"أُوقفت في 7 أغسطس 1980 بعد نفاد غاز التحكم بالاتجاه في مدارها 1,489.",b:"مركبة عريضة بجسم ثماني فضي وأربعة أذرع من ألواح شمسية، خزانان أبيضان في الأعلى وطبق هوائي ومنصة كاميرات معلّقة."}};

. لم تكن فيها مقاعد. أقلعت في 2 أغسطس 1971."],["","Landing legs","أرجل الهبوط","Four legs with round footpads held the bottom of the stage 1.5 metres above the ground. One leg carried the ladder.","أربع أرجل بأقدام مستديرة ترفع قاع المرحلة 1.5 متر عن الأرض. وعلى إحداها السلّم."],["","Engines","المحركات","The landing engine could be throttled and gave up to about 45,000 newtons of thrust. The ascent engine gave about 15,000 newtons.","كان محرك الهبوط قابلاً للتحكم في قوته ويعطي دفعاً حتى نحو 45000 نيوتن. ومحرك الصعود يعطي نحو 15000 نيوتن."]],heli:[["blades","Blades","الشفرات","Made of carbon fiber with a foam core to provide lift in the thin Mars atmosphere.","مصنوعة من ألياف الكربون بقلب من الرغوة لتوفر الرفع في الغلاف الجوي الرقيق للمريخ."],["ant","Antennas","الهوائيات","Radio antennas talk to Earth via the Mars 2020 rover and the Mars orbiters.","تتحدث هوائيات الراديو مع الأرض عبر المركبة الجوالة Mars 2020 والمركبات المدارية حول المريخ."],["solar","Solar panel","اللوح الشمسي","A solar panel helped keep the battery charged.","ساعد اللوح الشمسي على إبقاء البطارية مشحونة."],["body","Batteries, avionics and body","البطاريات والإلكترونيات والجسم","Batteries helped power the helicopter. Its avionics, or brains, helped it function and navigate. The body has insulation and heaters to keep sensitive electronics warm and survive cold Martian nights.","ساعدت البطاريات في تشغيل المروحية، وساعدتها إلكترونياتها، أو عقلها، على العمل والملاحة. وللجسم عزل وسخانات تبقي الإلكترونيات الحساسة دافئة لتنجو من ليالي المريخ الباردة."],["cam","Sensors and cameras","الحساسات والكاميرات","Sensors collected data on how fast the helicopter was traveling and in which direction. Cameras help the helicopter see.","جمعت الحساسات بيانات عن سرعة المروحية واتجاهها، وتساعدها الكاميرات على الرؤية."],["legs","Legs","الأرجل","Ultra-light legs made of carbon fiber tubes helped it land after flight.","أرجل خفيفة جداً من أنابيب ألياف الكربون ساعدتها على الهبوط بعد الطيران."]],
viking:[["hga","High-gain antenna","طبق الاتصال العالي الكسب","The S-band high-gain dish sent data directly to Earth.","كان طبق الاتصال العالي الكسب يرسل البيانات مباشرة إلى الأرض."],["rtg","RTG wind covers (nuclear power)","غطاءا المولّدين النوويين","Under these wind covers sat two SNAP-19 nuclear generators. They gave the lander electricity and heat for more than six years.","تحت هذين الغطاءين مولدان نوويان من نوع SNAP-19. أعطيا المركبة الكهرباء والحرارة أكثر من ست سنوات."],["cam","Cameras","الكاميرات","Two cameras took the first pictures from the surface of Mars, in three colours, and a 300-degree panorama of the plains around the lander.","التقطت الكاميرتان أولى الصور من سطح المريخ بثلاثة ألوان، وبانوراما بزاوية 300 درجة للسهول حول المركبة."],["sampler","Surface sampler boom","ذراع جمع العينات","The robot arm with its collector head scooped up the first soil samples on 28 July 1976 and placed them in the biology laboratory.","غرفت الذراع الآلية برأسها الجامع أول عينات التربة في 28 يوليو 1976 ووضعتها في مختبر الأحياء."],["met","Meteorology boom","ذراع الأرصاد","The weather boom carried sensors for temperature, pressure and wind speed. It measured from minus 86 to minus 33 degrees Celsius.","حمل ذراع الأرصاد حساسات للحرارة والضغط وسرعة الرياح. قاس من 86 إلى 33 درجة تحت الصفر."],["tank","Descent propellant tanks","خزانا وقود الهبوط","Two tanks held the propellant for the three engines that slowed the lander just before touchdown.","خزانان يحملان وقود المحركات الثلاثة التي أبطأت المركبة قبل لمس السطح."],["leg","Legs and footpads","الأرجل والأقدام","Three legs with footpads. The very first picture from Mars looked down at one of these footpads.","ثلاث أرجل بأقدام مستديرة. أول صورة من المريخ كانت تنظر إلى إحدى هذه الأقدام."],["uhf","UHF relay antenna","هوائي UHF","The UHF antenna sent the lander's data up to the orbiter, which relayed it to Earth.","كان هوائي UHF يرسل بيانات المركبة إلى المدارية، وهي تنقلها إلى الأرض."]],
vorb:[["panel","Solar panels","الألواح الشمسية","The orbiter was solar-powered. Four wings of solar panels turned sunlight into electricity.","كانت المدارية تعمل بالطاقة الشمسية. أربعة أجنحة من الألواح تحوّل ضوء الشمس إلى كهرباء."],["tank","Propellant tanks","خزانات الوقود","The tanks held fuel and oxidizer for the main engine.","تحمل الخزانات الوقود والمؤكسد للمحرك الرئيسي."],["engine","Propulsion motor","محرك الدفع","The orbiter's main rocket motor. The spacecraft entered orbit around Mars on 19 June 1976.","المحرك الصاروخي الرئيسي للمدارية. دخلت المركبة مدار المريخ في 19 يونيو 1976."],["hga","High-gain antenna","الهوائي العالي الكسب","The high-gain dish sent pictures and data to Earth, including the findings relayed from the lander.","كان الطبق العالي الكسب يرسل الصور والبيانات إلى الأرض، ومنها نتائج المركبة الهابطة."],["lga","Low-gain antenna mast","صاري الهوائي المنخفض","A second, smaller S-band antenna on a tall mast, beside the big dish.","هوائي ثانٍ أصغر يعمل على نطاق S، مثبت على صارٍ طويل بجانب الطبق الكبير."],["scan","Camera scan platform","منصة الكاميرات","This platform carried two cameras, an infrared thermal mapper and a water-vapour detector. The two Viking orbiters returned 52,663 images.","حملت هذه المنصة كاميرتين وراسماً حرارياً بالأشعة تحت الحمراء وكاشفاً لبخار الماء. أرسلت مداريتا فايكنغ 52663 صورة."]]};

["30 Jul 2020","30 يوليو 2020","Launch","الإطلاق","Ingenuity launched from Cape Canaveral Air Force Station in Florida, riding to Mars strapped beneath the Perseverance rover.","أُطلقت إنجينيويتي من محطة كيب كانافيرال للقوة الجوية في فلوريدا، وسافرت إلى المريخ مربوطة أسفل المركبة الجوالة بيرسيفرانس.","Cruise","الرحلة",{s:0,h:0,t:1.57}],
["18 Feb 2021","18 فبراير 2021","Landing in Jezero Crater","الهبوط في فوهة جيزيرو","Ingenuity reached the surface of Mars at Jezero Crater, still attached beneath Perseverance. It was designed as a technology demonstration.","وصلت إلى سطح المريخ في فوهة جيزيرو وهي ما زالت مثبتة أسفل بيرسيفرانس، وقد صُممت كعرض تقني.","Landing","الهبوط",{s:0,h:0,t:1.57}],
["29 Mar 2021","29 مارس 2021","Standing up","الوقوف","Ingenuity rotated outward from its horizontal position on the belly of Perseverance and extended vertically into place. The WATSON camera at the end of the rover's arm took the picture.","دارت إنجينيويتي إلى الخارج من وضعها الأفقي أسفل بطن بيرسيفرانس وامتدت عمودياً إلى مكانها. التقطت الصورة كاميرا WATSON في نهاية ذراع المركبة الجوالة.","Deployment","النشر",{s:0,h:0,t:0}],
["3 Apr 2021","3 أبريل 2021","Four feet on Mars","أربع أقدام على المريخ","Perseverance set Ingenuity down on the surface and drove about 4 metres away, so that sunlight could reach the solar panel on top of the rotors.","أنزلت بيرسيفرانس إنجينيويتي على السطح ثم ابتعدت نحو 4 أمتار، حتى يصل ضوء الشمس إلى اللوح الشمسي فوق الدوّارين.","Deployment","النشر",{"s":0,"h":0,"t":0}],
["4 Apr 2021","4 أبريل 2021","Surviving the first night","النجاة من الليلة الأولى","Ingenuity survived its first night alone. Nights in Jezero Crater can fall to minus 90 degrees Celsius, cold enough to crack unprotected electronics. Its blades were still stacked on top of each other.","نجت إنجينيويتي من أول ليلة وحدها. قد تهبط الحرارة ليلاً في فوهة جيزيرو إلى 90 درجة تحت الصفر، وهو برد يكفي لكسر الإلكترونيات غير المحمية. كانت شفراتها ما تزال مطوية فوق بعضها.","Deployment","النشر",{"s":0,"h":0,"t":0}],
["8 Apr 2021","8 أبريل 2021","First rotor spin test","أول اختبار لدوران الشفرات","With the blades unlocked, Ingenuity did a slow spin test on the 48th Martian day of the mission, watched by the Mastcam-Z camera on Perseverance.","بعد تحرير الشفرات أجرت إنجينيويتي اختبار دوران بطيئاً في اليوم المريخي الثامن والأربعين من المهمة، وصوّرته كاميرا Mastcam-Z على بيرسيفرانس.","Checkout","الفحص",{"s":0.25,"h":0,"t":0}],
["19 Apr 2021","19 أبريل 2021","First flight","الرحلة الأولى","The first powered, controlled flight on another planet, called a Wright Brothers moment. The plan was a technology demonstration of no more than five test flights in 30 days, in air less than 1 percent as dense as Earth's.","أول طيران بمحرك ومُتحكَّم به على كوكب آخر، وسُمّي لحظة الأخوين رايت. كانت الخطة عرضاً تقنياً لا يزيد عن خمس رحلات تجريبية خلال 30 يوماً، في هواء أقل من 1% من كثافة هواء الأرض.","Technology demo","العرض التقني",{s:1,h:.6,t:0}],
["25 Apr 2021","25 أبريل 2021","Flight 3: a photo of the rover","الرحلة 3: صورة للمركبة الجوالة","On its third flight Ingenuity flew 5 metres above the ground and photographed Perseverance from about 85 metres away.","في رحلتها الثالثة طارت إنجينيويتي على ارتفاع 5 أمتار وصوّرت بيرسيفرانس من مسافة نحو 85 متراً.","Technology demo","العرض التقني",{"s":1,"h":0.7,"t":0}],
["7 May 2021","7 مايو 2021","Flight 5: first one-way trip","الرحلة 5: أول رحلة بلا عودة","Ingenuity left Wright Brothers Field and flew 129 metres south to a new airfield. It climbed to a record 10 metres and stayed in the air for 108 seconds.","غادرت إنجينيويتي ميدان الأخوين رايت وطارت 129 متراً جنوباً إلى مهبط جديد. صعدت إلى ارتفاع قياسي بلغ 10 أمتار وبقيت في الجو 108 ثوانٍ.","Operations demo","العرض التشغيلي",{"s":1,"h":0.85,"t":0}],
["5 Jul 2021","5 يوليو 2021","Flight 9: over the dunes","الرحلة 9: فوق الكثبان","Ingenuity flew over the Séítah dune field, which was too risky for the rover to cross. Its colour pictures from about 10 metres up helped the rover team plan a safe route.","طارت إنجينيويتي فوق حقل كثبان سيتاه الذي كان عبوره خطراً على المركبة الجوالة. ساعدت صورها الملوّنة من ارتفاع نحو 10 أمتار فريق المركبة على تخطيط طريق آمن.","Aerial scout","كشاف جوي",{"s":1,"h":0.9,"t":0}],
["24 Jul 2021","24 يوليو 2021","Flight 10: Raised Ridges","الرحلة 10: التلال المرتفعة","On its most complex flight so far Ingenuity climbed to a new record of 12 metres, changed heading four times and took 10 pictures. Two of them were combined into a 3D view of the rocks called Raised Ridges.","في أعقد رحلاتها حتى ذلك الوقت صعدت إنجينيويتي إلى رقم قياسي جديد هو 12 متراً، وغيّرت اتجاهها أربع مرات والتقطت 10 صور. جُمعت صورتان منها في مشهد ثلاثي الأبعاد لصخور تُسمى التلال المرتفعة.","Aerial scout","كشاف جوي",{"s":1,"h":1,"t":0}],
["After the tech demo","بعد العرض التقني","Aerial scout","كشّاف جوي","Ingenuity began an operations demonstration, serving as an aerial scout for scientists and rover planners, previewing areas of possible interest for Perseverance, and helping engineers learn about debris from Perseverance's landing gear.","بدأت عرضاً تشغيلياً فصارت كشّافاً جوياً للعلماء ومخططي المسار، تستطلع مناطق قد تهم بيرسيفرانس وتساعد المهندسين على معرفة حطام معدات هبوطها.","Operations demo","العرض التشغيلي",{s:1,h:.8,t:0}],
["Final phase","المرحلة الأخيرة","Pushing the limits","اختبار الحدود","In its final phase Ingenuity entered an engineering demonstration phase, flying experimental tests that expanded the team's knowledge of the vehicle's aerodynamic limits.","في مرحلتها الأخيرة دخلت مرحلة عرض هندسي نفّذت فيها رحلات تجريبية وسّعت معرفة الفريق بحدود الديناميكا الهوائية للمركبة.","Engineering demo","العرض الهندسي",{s:1,h:1,t:0}],
["18 Jan 2024","18 يناير 2024","Flight 72","الرحلة 72 والأخيرة","Ingenuity flew for the last time. In total it flew 72 times for about 128.8 flying minutes, covering about 17 kilometres (10.5 miles), as high as 24 metres (78.7 feet) and as fast as 10 metres per second (22.4 mph).","حلّقت للمرة الأخيرة. حلّقت 72 مرة بنحو 128.8 دقيقة طيران، وقطعت نحو 17 كم (10.5 ميلاً)، وبلغت ارتفاع 24 متراً (78.7 قدماً) وسرعة 10 م/ث (22.4 ميل/س).","Final flight","الرحلة الأخيرة",{s:1,h:1,t:0},1],
["25 Jan 2024","25 يناير 2024","Mission complete","اكتملت المهمة","NASA completed the mission after nearly three years of aerial exploration and 72 historic flights. Designed for no more than five flights in 30 days, Ingenuity went far beyond.","أنهت ناسا المهمة بعد قرابة ثلاث سنوات من الاستكشاف الجوي و72 رحلة تاريخية. صُممت إنجينيويتي لخمس رحلات على الأكثر خلال 30 يوماً لكنها تجاوزت ذلك بكثير.","Complete","اكتمال",{s:0,h:0,t:0},1],
["Next","التالي","SkyFall","سكاي فول","Ingenuity paved the way for future aerial explorers at Mars. NASA's SkyFall mission, announced at the agency's Ignition event on March 24, will use a mid-air deployment to deliver next-generation Mars helicopters to scout human landing sites and map subsurface water ice. Their rotor blades broke the sound barrier in March tests.","مهدت إنجينيويتي الطريق لمستكشفين جويين قادمين. ستستخدم مهمة سكاي فول، التي أُعلن عنها في فعالية Ignition يوم 24 مارس، نشراً في الجو لإيصال مروحيات المريخ من الجيل التالي لاستطلاع مواقع هبوط البشر ورسم خرائط الجليد المائي تحت السطح. وقد تجاوزت شفراتها سرعة الصوت في اختبارات مارس.","The future","المستقبل",{s:0,h:0,t:0}]];
const TLS=Object.assign({heli:TL},{"surv":[["17 Apr 1967","17 أبريل 1967","Launch","الإطلاق","Surveyor 3 launched on an Atlas-Centaur rocket from Cape Canaveral. For the first time in the series it carried a surface sampler: a small scoop on an arm that could reach 1.5 metres.","أُطلقت سيرفيور 3 على صاروخ أطلس سنتور من كيب كانافيرال. ولأول مرة في السلسلة حملت أداة لأخذ عينات من السطح: مجرفة صغيرة على ذراع تصل إلى 1.5 متر.","Flight","الرحلة",{"s":0,"h":0.9,"t":0}],["20 Apr 1967","20 أبريل 1967","A landing with two bounces","هبوط بقفزتين","Highly reflective rocks confused the landing radar and the engine did not shut off in time. Surveyor 3 bounced twice, first to about 10 metres and then to about 3 metres, before settling in Oceanus Procellarum.","أربكت صخور شديدة اللمعان رادار الهبوط فلم يتوقف المحرك في الوقت المناسب. قفزت سيرفيور 3 مرتين، الأولى إلى نحو 10 أمتار والثانية إلى نحو 3 أمتار، ثم استقرت في محيط العواصف.","Landing","الهبوط",{"s":0,"h":0,"t":0}],["April 1967","أبريل 1967","Digging the Moon","حفر تربة القمر","Following commands from Earth, the scoop dug four trenches and made four bearing tests and thirteen impact tests. Scientists concluded the soil was like wet sand and solid enough to hold an Apollo lunar module.","بأوامر من الأرض حفرت المجرفة أربعة خنادق وأجرت أربعة اختبارات تحمّل وثلاثة عشر اختبار صدم. استنتج العلماء أن التربة تشبه الرمل المبلل وأنها صلبة بما يكفي لحمل مركبة أبولو القمرية.","Science","العلم",{"s":0,"h":0,"t":0}],["April to May 1967","أبريل ومايو 1967","6,326 pictures","6326 صورة","Less than an hour after landing the TV camera began sending pictures: 6,326 in all. A single 200-line picture took about 20 seconds to transmit.","بعد أقل من ساعة من الهبوط بدأت كاميرا التلفاز ترسل الصور: 6326 صورة في المجموع. كان إرسال صورة واحدة من 200 سطر يستغرق نحو 20 ثانية.","Science","العلم",{"s":0,"h":0,"t":0}],["4 May 1967","4 مايو 1967","Last contact","آخر اتصال","The last contact with Surveyor 3 came two days after the long lunar night began.","كان آخر اتصال مع سيرفيور 3 بعد يومين من بدء الليل القمري الطويل.","Silence","الصمت",{"s":0,"h":0,"t":0,"dust":0.1}],["19 Nov 1969","19 نوفمبر 1969","Visitors from Apollo 12","زوّار من أبولو 12","Apollo 12 landed about 180 metres away. Astronauts Charles Conrad and Alan Bean walked over and took parts home, including the scoop and the camera, so scientists could study the effect of about two and a half years on the Moon.","هبطت أبولو 12 على بعد نحو 180 متراً. مشى رائدا الفضاء تشارلز كونراد وآلان بين إليها وأخذا أجزاء منها إلى الأرض، منها المجرفة والكاميرا، ليدرس العلماء أثر نحو سنتين ونصف على سطح القمر.","A visit","زيارة",{"s":0,"h":0,"t":0,"hide":"cam,scoop","dust":0.25}],["Today","اليوم","Still standing","ما زالت واقفة","Surveyor 3 remains in Oceanus Procellarum, without its camera and scoop.","ما زالت سيرفيور 3 في محيط العواصف، من دون كاميرتها ومجرفتها.","Today","اليوم",{"s":0,"h":0,"t":0,"hide":"cam,scoop","dust":0.4}]],"viking":[["20 Aug 1975","20 أغسطس 1975","Launch","الإطلاق","Viking 1 launched on a Titan IIIE-Centaur rocket. The lander travelled to Mars attached to its orbiter.","أُطلقت فايكنغ 1 على صاروخ تيتان 3E سنتور. سافرت المركبة الهابطة إلى المريخ وهي متصلة بمركبتها المدارية.","Cruise","الرحلة",{"s":0,"h":0.9,"t":0,"hide":"sampler"}],["19 Jun 1976","19 يونيو 1976","In orbit around Mars","في مدار المريخ","The spacecraft entered orbit. Its photos showed that the planned landing site was rougher than expected, so scientists chose a new site on the western slopes of Chryse Planitia. The landing had been hoped for 4 July 1976.","دخلت المركبة مدار المريخ. أظهرت صورها أن موقع الهبوط المخطط أكثر وعورة من المتوقع، فاختار العلماء موقعاً جديداً على المنحدرات الغربية لسهل كريسي. كان الهبوط مأمولاً في 4 يوليو 1976.","Orbit","المدار",{"s":0,"h":0.9,"t":0,"hide":"sampler"}],["20 Jul 1976","20 يوليو 1976","Touchdown","الهبوط","The lander separated from the orbiter and set down safely at 22.483 degrees north, 47.94 degrees west, about 28 kilometres from its planned target. Twenty-five seconds later it took the first picture from the surface of Mars.","انفصلت المركبة الهابطة عن المدارية وهبطت بسلام عند 22.483 درجة شمالاً و47.94 درجة غرباً، على بعد نحو 28 كيلومتراً من هدفها. وبعد خمس وعشرين ثانية التقطت أول صورة من سطح المريخ.","Landing","الهبوط",{"s":0,"h":0,"t":0,"hide":"sampler"}],["28 Jul 1976","28 يوليو 1976","The first scoop of soil","أول مغرفة تربة","The robot arm scooped up the first soil samples and placed them in the biology laboratory. The experiments found unexpected chemical activity in the soil, but no clear evidence of living microorganisms.","غرفت الذراع الآلية أول عينات التربة ووضعتها في مختبر الأحياء. وجدت التجارب نشاطاً كيميائياً غير متوقع في التربة، لكنها لم تجد دليلاً واضحاً على كائنات حية دقيقة.","Science","العلم",{"s":0,"h":0,"t":0}],["1976 to 1982","من 1976 إلى 1982","A weather station on Mars","محطة طقس على المريخ","The lander sent weather reports every day, and later every week. It measured from minus 86 degrees Celsius before dawn to minus 33 degrees in the afternoon.","أرسلت المركبة تقارير الطقس كل يوم ثم كل أسبوع. قاست الحرارة من 86 درجة تحت الصفر قبل الفجر إلى 33 درجة تحت الصفر بعد الظهر.","Monitoring","المراقبة",{"s":0,"h":0,"t":0,"dust":0.2}],["January 1982","يناير 1982","A new name","اسم جديد","The lander was renamed the Thomas Mutch Memorial Station, in honour of the leader of the Viking imaging team.","سُمّيت المركبة محطة توماس موتش التذكارية، تكريماً لقائد فريق التصوير في فايكنغ.","Monitoring","المراقبة",{"s":0,"h":0,"t":0,"dust":0.3}],["11 Nov 1982","11 نوفمبر 1982","Last contact","آخر اتصال","A faulty command sent from Earth interrupted communications. Attempts to regain contact were unsuccessful.","قطع أمر خاطئ أُرسل من الأرض الاتصال بالمركبة. ولم تنجح محاولات استعادة الاتصال.","Silence","الصمت",{"s":0,"h":0,"t":0,"dust":0.4}]],"vorb":[["20 Aug 1975","20 أغسطس 1975","Launch","الإطلاق","The orbiter carried the lander all the way to Mars. Its design borrowed heavily from the Mariner spacecraft.","حملت المركبة المدارية المركبة الهابطة طوال الطريق إلى المريخ. استُمد تصميمها بدرجة كبيرة من مركبات مارينر.","Cruise","الرحلة",{"s":0,"h":0,"t":0,"cap":1}],["19 Jun 1976","19 يونيو 1976","Arrival at Mars","الوصول إلى المريخ","The spacecraft entered orbit and photographed the planned landing site. The pictures showed rough ground, so the team picked a safer place.","دخلت المركبة المدار وصوّرت موقع الهبوط المخطط. أظهرت الصور أرضاً وعرة فاختار الفريق مكاناً أكثر أماناً.","Orbit","المدار",{"s":0,"h":0,"t":0,"cap":1}],["20 Jul 1976","20 يوليو 1976","Releasing the lander","إطلاق المركبة الهابطة","The lander separated at 08:32 UT and landed safely. The orbiter stayed above Mars and relayed the lander's findings to Earth.","انفصلت المركبة الهابطة عند الساعة 08:32 بالتوقيت العالمي وهبطت بسلام. بقيت المدارية فوق المريخ ونقلت نتائج الهابطة إلى الأرض.","Separation","الانفصال",{"s":0,"h":0,"t":0}],["1976 to 1980","من 1976 إلى 1980","Mapping a planet","رسم خريطة كوكب","Together the two Viking orbiters returned 52,663 images and mapped about 97 percent of Mars at a resolution of 300 metres.","أرسلت المداريتان معاً 52663 صورة ورسمتا خريطة نحو 97 في المئة من سطح المريخ بدقة 300 متر.","Mapping","رسم الخرائط",{"s":0,"h":0,"t":0}],["7 Aug 1980","7 أغسطس 1980","Shutdown","الإيقاف","The orbiter was shut down after it ran out of attitude-control propellant, on its 1,489th orbit around Mars.","أُوقفت المدارية بعد أن نفد وقود التحكم في الاتجاه، في دورتها رقم 1489 حول المريخ.","End","النهاية",{"s":0,"h":0,"t":0}]],"falcon":[["26 Jul 1971","26 يوليو 1971","Launch","الإطلاق","Apollo 15 launched on a Saturn V rocket, carrying the lunar module Falcon, the Lunar Roving Vehicle and the ALSEP science station.","انطلقت أبولو 15 على صاروخ ساتورن 5 وهي تحمل المركبة القمرية فالكون والمركبة الجوالة ومحطة العلوم ALSEP.","Flight","الرحلة",{"s":0,"h":0.8,"t":0}],["30 Jul 1971","30 يوليو 1971","Landing at Hadley–Apennine","الهبوط في هادلي–أبنين","Falcon landed with David Scott and James Irwin at 26.13 degrees north, 3.63 degrees east, at the foot of the Apennine mountains.","هبطت فالكون وعلى متنها ديفيد سكوت وجيمس إروين عند 26.13 درجة شمالاً و3.63 درجة شرقاً، عند سفح جبال أبنين.","Landing","الهبوط",{"s":0,"h":0,"t":0}],["31 Jul to 2 Aug 1971","من 31 يوليو إلى 2 أغسطس 1971","Three moonwalks","ثلاث جولات على القمر","The astronauts spent 18 hours and 35 minutes outside. They covered 27.9 kilometres with the rover, collected 77.31 kilograms of rock and soil, and set up the ALSEP science station.","قضى الرائدان 18 ساعة و35 دقيقة خارج المركبة. قطعا 27.9 كيلومتراً بالمركبة الجوالة، وجمعا 77.31 كيلوغراماً من الصخور والتربة، ونصبا محطة العلوم ALSEP.","Exploration","الاستكشاف",{"s":0,"h":0,"t":0}],["2 Aug 1971","2 أغسطس 1971","Liftoff","الإقلاع","After 66 hours and 55 minutes on the Moon the ascent stage lifted off and carried the astronauts back to the command module. The descent stage served as its launch platform and stayed on the Moon.","بعد 66 ساعة و55 دقيقة على القمر أقلعت مرحلة الصعود وأعادت الرائدين إلى مركبة القيادة. كانت مرحلة الهبوط منصة الإقلاع وبقيت على القمر.","Departure","المغادرة",{"s":0,"h":0,"t":0,"cut":1}],["3 Aug 1971","3 أغسطس 1971","The ascent stage falls","سقوط مرحلة الصعود","The empty ascent stage was released and struck the Moon at 26.36 degrees north, 0.25 degrees east.","أُفلتت مرحلة الصعود الفارغة فاصطدمت بالقمر عند 26.36 درجة شمالاً و0.25 درجة شرقاً.","Departure","المغادرة",{"s":0,"h":0,"t":0,"cut":1}],["30 Sep 1977","30 سبتمبر 1977","The science station is switched off","إيقاف محطة العلوم","The ALSEP station had sent data to Earth since 31 July 1971. It was shut down together with the other ALSEP stations.","ظلت محطة ALSEP ترسل البيانات إلى الأرض منذ 31 يوليو 1971. ثم أُوقفت مع بقية محطات ALSEP.","Silence","الصمت",{"s":0,"h":0,"t":0,"cut":1,"dust":0.2}],["Today","اليوم","What remains","ما بقي هناك","The descent stage, the rover, the science station and the memorial to fourteen fallen space explorers are still at Hadley–Apennine.","ما زالت مرحلة الهبوط والمركبة الجوالة ومحطة العلوم والنصب التذكاري لأربعة عشر مستكشف فضاء راحلين في هادلي–أبنين.","Today","اليوم",{"s":0,"h":0,"t":0,"cut":1,"dust":0.3}]]}),TLc=()=>(ca&&TLS[ca.shape])||TL,FUT={"heli":[["🛠️","Lessons for the next helicopters","دروس للمروحيات القادمة","NASA is using what Ingenuity taught to build the next Mars helicopters. In tests in March, rotor blades for the next generation went faster than the speed of sound.","تستخدم ناسا ما تعلّمته من إنجينيويتي لبناء مروحيات المريخ القادمة. وفي اختبارات شهر مارس تجاوزت شفرات الجيل القادم سرعة الصوت.","f","n",""],["🗺️","A scout for the rover","كشّاف للمركبة الجوالة","Its photos showed that the Séítah dunes were too risky for Perseverance, and helped the rover team plan a safe route.","أظهرت صورها أن كثبان سيتاه خطرة على بيرسيفرانس، وساعدت فريق المركبة على تخطيط طريق آمن.","f","n",""],["📊","A record of 72 flights","سجلّ 72 رحلة","NASA published a log of all 72 flights, with the time, distance, speed and height of each one, so engineers can study how flying on Mars works.","نشرت ناسا سجلاً لكل الرحلات الـ72، فيه زمن كل رحلة ومسافتها وسرعتها وارتفاعها، ليدرس المهندسون كيف يعمل الطيران على المريخ.","f","n",""],["🚁","Scouting places for people to land","استطلاع أماكن هبوط البشر","NASA's SkyFall mission plans to send a team of new Mars helicopters to scout landing sites for people and to map water ice under the ground.","تخطط مهمة SkyFall من ناسا لإرسال فريق من المروحيات الجديدة إلى المريخ لاستطلاع أماكن هبوط البشر ورسم خريطة الجليد المائي تحت السطح.","f","u",""],["🧭","Checking the way first","تفقّد الطريق أولاً","Before people walk or drive to a new place on Mars, small helicopters could fly ahead and check the way.","قبل أن يمشي الناس أو يقودوا إلى مكان جديد على المريخ، يمكن لمروحيات صغيرة أن تطير أمامهم وتتفقد الطريق.","i","u",""],["🏛️","The first aircraft of another world","أول طائرة في عالم آخر","People living at Jezero one day could keep Ingenuity where it stopped, the way museums on Earth keep the first aeroplanes.","يمكن لمن يعيش في جيزيرو يوماً أن يحفظ إنجينيويتي في مكانها حيث توقفت، كما تحفظ متاحف الأرض أولى الطائرات.","i","u",""],["📱","A phone chip on Mars","شريحة هاتف على المريخ","Ingenuity's computer used a smartphone processor (Qualcomm Snapdragon 801) instead of a special space computer. It showed that ordinary, low-cost electronics can work on another planet, which can make future missions cheaper.","استعمل حاسوب إنجينيويتي معالج هاتف ذكي (Qualcomm Snapdragon 801) بدل حاسوب فضائي خاص. وأثبت أن الإلكترونيات العادية الرخيصة يمكن أن تعمل على كوكب آخر، مما قد يجعل المهمات القادمة أقل كلفة.","k","e","https://spectrum.ieee.org/nasa-designed-perseverance-helicopter-rover-fly-autonomously-mars"],["🚁","Better drones on Earth","طائرات مسيّرة أفضل على الأرض","Flying in air less than 1% as thick as Earth's taught engineers a lot about rotors. The same knowledge could help drones that fly high in mountains or help in rescue missions.","الطيران في هواء كثافته أقل من 1% من هواء الأرض علّم المهندسين الكثير عن الشفرات. ويمكن لهذه المعرفة أن تساعد الطائرات المسيّرة التي تطير عالياً في الجبال أو تساعد في مهام الإنقاذ.","i","e",""]],"viking":[["📷","The first close look at Mars","أول نظرة قريبة إلى المريخ","Viking 1 sent the first pictures from the surface of Mars. Every Mars mission since then builds on what the Vikings began.","أرسلت فايكنغ 1 أولى الصور من سطح المريخ. وكل مهمة إلى المريخ بعدها تبني على ما بدأته مركبتا فايكنغ.","f","n",""],["🌡️","A weather record","سجلّ للطقس","It measured the weather for years, from minus 86 °C before dawn to minus 33 °C in the afternoon. Scientists still use records like this to understand Mars.","قاست الطقس سنوات، من 86 تحت الصفر قبل الفجر إلى 33 تحت الصفر بعد الظهر. وما زال العلماء يستعملون سجلات كهذه لفهم المريخ.","f","n",""],["🧪","Questions about life","أسئلة عن الحياة","Its soil tests found a lot of sulfur and no clear sign of life. Missions today are still trying to learn whether Mars was ever able to support life.","وجدت تجارب التربة كثيراً من الكبريت ولم تجد دليلاً واضحاً على الحياة. وما زالت مهمات اليوم تحاول معرفة إن كان المريخ صالحاً للحياة يوماً.","f","n",""],["🪂","Choosing a safe place to land","اختيار مكان آمن للهبوط","Viking 1's team moved the landing site after orbit photos showed rough ground. Crews landing on Mars will need to choose their landing place the same careful way.","غيّر فريق فايكنغ 1 موقع الهبوط بعدما أظهرت صور المدار أرضاً وعرة. وسيحتاج من يهبطون على المريخ إلى اختيار مكانهم بالحرص نفسه.","f","u",""],["⚛️","Power through the cold night","طاقة في الليل البارد","The Viking landers ran on two nuclear generators. A future base on Mars could use a similar power source when dust hides the Sun.","عملت مركبتا هبوط فايكنغ بمولّدين نوويين. ويمكن لقاعدة مستقبلية على المريخ أن تستخدم مصدر طاقة مشابهاً حين يحجب الغبار الشمس.","i","u",""],["🌱","Knowing the soil before growing food","معرفة التربة قبل الزراعة","People who live on Mars will need to test the soil, as Viking did, before they build on it or try to grow food.","سيحتاج من يعيشون على المريخ إلى فحص التربة كما فعلت فايكنغ، قبل البناء عليها أو محاولة الزراعة فيها.","i","u",""],["☄️","Pieces of Mars on Earth","قطع من المريخ على الأرض","Viking measured the gases in the air of Mars. Scientists later found the same mix of gases trapped inside some meteorites found on Earth, which showed that those rocks came from Mars. Today these meteorites let us study Mars in laboratories on Earth.","قاست فايكنغ غازات هواء المريخ. ثم وجد العلماء الخليط نفسه محبوساً داخل بعض النيازك التي وُجدت على الأرض، فعرفوا أن هذه الصخور جاءت من المريخ. واليوم تتيح لنا هذه النيازك دراسة المريخ في مختبرات على الأرض.","k","e",""],["🌍","Understanding our own climate","فهم مناخ أرضنا","Viking's years of weather records show how a cold, dry planet with very thin air behaves. Comparing Mars with Earth helps scientists test the climate models they use for our own planet.","تُظهر سنوات من سجلات طقس فايكنغ كيف يتصرف كوكب بارد وجاف بهواء رقيق جداً. ومقارنة المريخ بالأرض تساعد العلماء على اختبار نماذج المناخ التي يستعملونها لكوكبنا.","i","e",""]],"vorb":[["🗺️","Maps of almost all of Mars","خرائط لمعظم المريخ","The two Viking orbiters sent 52,663 images and mapped about 97 percent of Mars at a resolution of 300 metres.","أرسلت مداريتا فايكنغ 52663 صورة ورسمتا خريطة نحو 97 في المئة من المريخ بدقة 300 متر.","f","n",""],["🌑","Pictures of Mars and its moons","صور المريخ وقمريه","The orbiter took many high-resolution pictures of Mars and of its two moons, far better than the earlier Mariner 9 pictures.","التقطت المدارية صوراً كثيرة عالية الدقة للمريخ وقمريه، أفضل بكثير من صور مارينر 9 قبلها.","f","n",""],["📍","Looking before landing","النظر قبل الهبوط","Before people land on Mars, orbiters will photograph the landing place first, just as Viking's orbiter did in 1976.","قبل أن يهبط البشر على المريخ ستصوّر المركبات المدارية مكان الهبوط أولاً، كما فعلت مدارية فايكنغ عام 1976.","i","u",""],["📡","A relay in the sky","محطة ترحيل في السماء","The orbiter passed the lander's messages to Earth. People living on Mars would also need satellites to stay in touch with home.","نقلت المدارية رسائل المركبة الهابطة إلى الأرض. وسيحتاج من يعيشون على المريخ أيضاً إلى أقمار صناعية ليبقوا على اتصال بالأرض.","i","u",""],["🌪️","Warnings about dust storms","التحذير من عواصف الغبار","Satellites above Mars could warn people about dust storms, the way weather satellites warn us about storms on Earth.","يمكن لأقمار فوق المريخ أن تحذّر الناس من عواصف الغبار، كما تحذّرنا أقمار الطقس من العواصف على الأرض.","i","u",""],["🛰️","Watching a planet from above","مراقبة كوكب من الأعلى","Mapping a whole planet from orbit is the same idea as Earth-observation satellites, which today watch weather, forests, farms and floods.","رسم خريطة كوكب كامل من المدار هو الفكرة نفسها التي تقوم عليها أقمار مراقبة الأرض، التي تراقب اليوم الطقس والغابات والمزارع والفيضانات.","i","e",""],["📚","A reference for decades","مرجع لعقود","With 52,663 images and about 97% of Mars mapped, the Viking orbiters gave scientists and teachers the main pictures of Mars for many years.","بـ52663 صورة وخريطة لنحو 97% من المريخ، قدّمت مداريتا فايكنغ للعلماء والمعلمين الصور الأساسية للمريخ سنوات طويلة.","f","e",""]],"surv":[["🦶","Safe ground for Apollo","أرض آمنة لأبولو","Surveyor 3 showed that the Moon's soil is like wet sand and strong enough to hold an Apollo lunar module. That helped make the Apollo landings possible.","بيّنت سيرفيور 3 أن تربة القمر تشبه الرمل المبلل وقوية بما يكفي لحمل مركبة أبولو القمرية، فساعدت على جعل هبوط أبولو ممكناً.","f","n",""],["🔬","How machines age on the Moon","كيف تشيخ الآلات على القمر","Apollo 12 astronauts brought its camera and scoop back to Earth, so scientists could study what two and a half years on the Moon did to them.","أعاد رواد أبولو 12 كاميرتها ومجرفتها إلى الأرض، ليدرس العلماء ما فعلته بهما سنتان ونصف على القمر.","f","n",""],["🏗️","Testing the ground before building","فحص الأرض قبل البناء","Before people build a base on the Moon, they will need to test the ground the way Surveyor 3 did.","قبل أن يبني البشر قاعدة على القمر، سيحتاجون إلى فحص الأرض كما فعلت سيرفيور 3.","i","u",""],["🏛️","A place to protect","مكان نحميه","Future visitors could walk around Surveyor 3 on a marked path, looking without touching, so the site stays as history left it.","يمكن لزوار المستقبل أن يدوروا حول سيرفيور 3 على مسار محدد، ينظرون ولا يلمسون، ليبقى الموقع كما تركه التاريخ.","i","u",""],["🛰️","Lessons for satellites","دروس للأقمار الصناعية","Scientists studied the camera and scoop that Apollo 12 brought back after about two and a half years on the Moon. Learning how materials age in space helps engineers build equipment that lasts longer, including the satellites we use every day on Earth.","درس العلماء الكاميرا والمجرفة اللتين أعادتهما أبولو 12 بعد نحو سنتين ونصف على القمر. ومعرفة كيف تشيخ المواد في الفضاء تساعد المهندسين على صنع معدات تدوم أطول، ومنها الأقمار الصناعية التي نستعملها كل يوم على الأرض.","f","e",""],["📐","Measuring the ground","قياس الأرض","Surveyor 3 tested how strong the soil was by digging and pressing it. Engineers on Earth test soil the same way before they build roads, bridges and houses.","اختبرت سيرفيور 3 قوة التربة بالحفر والضغط عليها. والمهندسون على الأرض يختبرون التربة بالطريقة نفسها قبل بناء الطرق والجسور والبيوت.","i","e",""]],"falcon":[["📈","Years of data about the Moon","سنوات من بيانات القمر","The ALSEP station left here sent data about the Moon to Earth from 1971 to 1977, for long-term research.","أرسلت محطة ALSEP التي تُركت هنا بيانات عن القمر إلى الأرض من 1971 إلى 1977، لأبحاث طويلة المدى.","f","n",""],["🪨","77 kilograms of Moon","77 كيلوغراماً من القمر","The astronauts brought 77.31 kilograms of rock and soil back to Earth for scientists to study.","أعاد الرائدان 77.31 كيلوغراماً من الصخور والتربة إلى الأرض ليدرسها العلماء.","f","n",""],["🚙","Cars to travel far","مركبات للسفر بعيداً","Apollo 15 was the first mission to use a rover on the Moon. People living on the Moon will need vehicles to travel far from their base.","كانت أبولو 15 أول مهمة تستخدم مركبة جوالة على القمر. وسيحتاج من يعيشون على القمر إلى مركبات ليبتعدوا عن قاعدتهم.","i","u",""],["⚛️","Power for the long night","طاقة لليل الطويل","The science station ran on a SNAP-27 nuclear generator. A Moon base could use nuclear power to stay warm through the long lunar night.","عملت محطة العلوم بمولّد نووي من نوع SNAP-27. ويمكن لقاعدة على القمر أن تستخدم الطاقة النووية لتبقى دافئة في الليل القمري الطويل.","i","u",""],["🔦","A mirror on the Moon that still works","مرآة على القمر ما زالت تعمل","Apollo 15 left a laser mirror (a retroreflector) on the Moon. Observatories on Earth still fire lasers at it to measure the distance to the Moon to within centimetres. These measurements showed the Moon moves away from Earth by about 3.8 cm a year, and they test Einstein's theory of gravity.","تركت أبولو 15 على القمر مرآة لليزر (عاكساً). وما زالت مراصد على الأرض تطلق الليزر نحوها لتقيس بُعد القمر بدقة سنتيمترات. بيّنت هذه القياسات أن القمر يبتعد عن الأرض نحو 3.8 سم كل سنة، وتُستخدم لاختبار نظرية أينشتاين في الجاذبية.","k","e","https://photojournal.jpl.nasa.gov/catalog/PIA13037"],["🪨","Moon rocks in labs today","صخور القمر في المختبرات اليوم","The 77.31 kg of rock and soil from Apollo 15 are kept by NASA and still lent to scientists. They help explain how the Moon formed, and with it the early history of the Earth.","الـ77.31 كيلوغراماً من صخور أبولو 15 وتربتها تحفظها ناسا وما زالت تُعار للعلماء. وهي تساعد على فهم كيف تكوّن القمر، ومعه التاريخ المبكر للأرض.","k","e","https://curator.jsc.nasa.gov/lunar/"]]};

const RCY={"surv":[["Its glass lenses and mirror could become parts of new telescopes for a Moon base.","يمكن أن تصبح عدساتها ومرآتها الزجاجية أجزاء لتلسكوبات جديدة في قاعدة على القمر."],["The metal arm could be reused as a small crane or a tool for digging.","يمكن إعادة استعمال الذراع المعدنية كرافعة صغيرة أو أداة للحفر."],["The aluminium legs could be melted and cast into new beams.","يمكن صهر الأرجل المصنوعة من الألمنيوم وصبّها عوارض جديدة."],["The engine nozzles could be cleaned and studied, or melted for their metal.","يمكن تنظيف فوهات المحركات ودراستها، أو صهرها للاستفادة من معدنها."],["Its solar cells could be tested and, if they still work, wired into a small power station.","يمكن فحص الخلايا الشمسية، وإن كانت ما زالت تعمل توصيلها في محطة طاقة صغيرة."]],"falcon":[["Falcon's site is part of history, so it should be protected. Only loose pieces near it could be collected and melted into building metal.","موقع فالكون جزء من التاريخ ويجب حمايته. يمكن فقط جمع القطع المتناثرة حوله وصهرها كمعدن للبناء."],["The ascent stage crashed on the Moon. Its scattered aluminium could be gathered and recycled.","تحطمت مرحلة الصعود على القمر. يمكن جمع الألمنيوم المتناثر منها وإعادة تدويره."],["Legs like these could hold up antennas or solar panels at a new base.","يمكن لأرجل مثلها أن تحمل هوائيات أو ألواحاً شمسية في قاعدة جديدة."],["Engine parts could be studied to learn how rocket metal ages, then melted down.","يمكن دراسة أجزاء المحرك لمعرفة كيف يشيخ معدن الصواريخ، ثم صهرها."]],"viking":[["The dish could be cleaned and pointed at Earth again as a backup antenna for a Mars base.","يمكن تنظيف الطبق وتوجيهه نحو الأرض من جديد كهوائي احتياطي لقاعدة على المريخ."],["After nearly 50 years the nuclear fuel has lost much of its power. Experts would have to handle it safely; the metal covers could be reused.","بعد قرابة 50 سنة فقد الوقود النووي كثيراً من قوته، ويجب أن يتعامل معه خبراء بأمان. أما الأغطية المعدنية فيمكن إعادة استعمالها."],["The camera lenses could be reused in new weather or security cameras for a base.","يمكن إعادة استعمال عدسات الكاميرا في كاميرات طقس أو مراقبة جديدة للقاعدة."],["The long arm could become a crane for lifting soil samples or tools.","يمكن أن تصبح الذراع الطويلة رافعة لرفع عينات التربة أو الأدوات."],["The weather boom is the perfect start for a new weather station.","ذراع الأرصاد بداية مثالية لمحطة طقس جديدة."],["Empty tanks could store water or air made on Mars.","يمكن أن تخزّن الخزانات الفارغة ماءً أو هواءً يُصنع على المريخ."],["The aluminium legs and footpads could be melted into new parts.","يمكن صهر الأرجل والأقدام المصنوعة من الألمنيوم لصنع قطع جديدة."],["The UHF antenna could carry messages between rovers and a base.","يمكن أن ينقل هوائي UHF الرسائل بين المركبات الجوالة والقاعدة."]],"vorb":[["If it were found, the solar panels could be checked and reused for power.","لو عُثر عليها، يمكن فحص الألواح الشمسية وإعادة استعمالها للطاقة."],["Strong tanks could store fuel, water or air.","يمكن للخزانات القوية أن تخزّن وقوداً أو ماءً أو هواءً."],["The engine could be studied to learn how rocket parts age after decades in space.","يمكن دراسة المحرك لمعرفة كيف تشيخ أجزاء الصواريخ بعد عقود في الفضاء."],["The dish could become an antenna for talking with Earth.","يمكن أن يصبح الطبق هوائياً للتواصل مع الأرض."],["The mast could hold up a radio or a light.","يمكن أن يحمل الصاري جهاز راديو أو مصباحاً."],["The cameras' lenses and mirrors could be reused in new instruments.","يمكن إعادة استعمال عدسات الكاميرات ومراياها في أجهزة جديدة."]],"heli":[["Carbon-fibre blades are light and strong. They could be cut and reused as light parts for tools or shelves.","الشفرات من ألياف الكربون خفيفة وقوية. يمكن قصّها وإعادة استعمالها كقطع خفيفة لأدوات أو رفوف."],["The small antennas could be reused for short-range radio links.","يمكن إعادة استعمال الهوائيات الصغيرة لاتصالات لاسلكية قصيرة المدى."],["Its solar panel could charge small sensors near a base.","يمكن للوح الشمسي أن يشحن حساسات صغيرة قرب القاعدة."],["The electronics could be studied to see how a phone chip survived years on Mars, then their metals recovered.","يمكن دراسة الإلكترونيات لمعرفة كيف صمدت شريحة هاتف سنوات على المريخ، ثم استخلاص معادنها."],["Its cameras could be reused as small cameras for a base.","يمكن إعادة استعمال كاميراتها ككاميرات صغيرة للقاعدة."],["The carbon-fibre legs could become light frames or supports.","يمكن أن تصبح الأرجل من ألياف الكربون إطارات أو دعامات خفيفة."]]};for(const k in RCY)RCY[k].forEach((v,n)=>{const e=PARTS[k]&&PARTS[k][n];if(e){while(e.length<5)e.push("");e[5]=v[0];e[6]=v[1]}});

const TP={heli:[
["📏","Tech specs","المواصفات","I weigh 1.8 kilograms and my two rotors span just under 1.2 metres. My solar panel charges lithium-ion batteries, enough for one 90-second flight per Martian day, using about 350 watts of average power during flight.","كتلتي 1.8 كغ وامتداد دوّاريّ أقل من 1.2 م. يشحن لوحي الشمسي بطاريات ليثيوم أيون وتكفي لرحلة واحدة مدتها 90 ثانية في اليوم المريخي، بمتوسط طاقة نحو 350 واط أثناء الطيران.","specs weight mass size blade rotor power battery solar مواصفات وزن بطارية"],
["🌬️","Thin air","الهواء الرقيق","I flew in an atmosphere less than 1 percent as dense as Earth's. I was designed to fly up to 5 metres high and up to 300 metres away, but I eventually reached 24 metres.","طرت في غلاف جوي أقل من 1% من كثافة غلاف الأرض. صُممت لأطير حتى 5 أمتار ارتفاعاً وحتى 300 متر مدى، لكنني بلغت في النهاية 24 متراً.","air atmosphere thin altitude high range height هواء ارتفاع"],
["🔭","Aerial scout","كشّاف جوي","After my technology demonstration I became an aerial scout for scientists and rover planners, previewing areas of possible interest for Perseverance and helping engineers learn about debris from its landing gear.","بعد عرضي التقني صرت كشّافاً جوياً للعلماء ومخططي مسار المركبة الجوالة، أستطلع مناطق قد تهم بيرسيفرانس وأساعد المهندسين على معرفة حطام معدات هبوطها.","scout scouting perseverance rover debris explore كشاف استطلاع"],
["🏁","Final numbers","الأرقام النهائية","72 flights, about 128.8 flying minutes, about 17 kilometres, up to 24 metres high and up to 10 metres per second.","72 رحلة، نحو 128.8 دقيقة طيران، نحو 17 كم، حتى 24 متراً ارتفاعاً وحتى 10 م/ث.","numbers total flights minutes distance speed record أرقام رحلات مسافة"],
["🏆","Wright Brothers moment","لحظة الأخوين رايت","On 19 April 2021 I made the first powered, controlled flight on another planet, a feat that has been called a Wright Brothers moment.","في 19 أبريل 2021 نفّذت أول طيران بمحرك ومُتحكَّم به على كوكب آخر، وهو إنجاز سُمّي لحظة الأخوين رايت.","wright brothers first flight history أول طيران تاريخ"],
["🚁","SkyFall","سكاي فول","SkyFall will build on my success: a daring mid-air deployment will deliver a team of next-generation Mars helicopters to scout human landing sites and map subsurface water ice. Their rotor blades broke the sound barrier in March tests.","ستبني سكاي فول على نجاحي: نشر جريء في الجو سيوصل فريقاً من مروحيات المريخ من الجيل التالي لاستطلاع مواقع هبوط البشر ورسم خرائط الجليد المائي تحت السطح. وقد تجاوزت شفراتها سرعة الصوت في اختبارات مارس.","skyfall next future helicopters mach sound مستقبل مروحيات"]],

["🛬","Bouncy landing","هبوط مرتد","During my descent, highly reflective rocks confused my descent radar, so my main engines did not cut off at the correct altitude. I bounced off the lunar surface twice before settling into a soft landing.","أثناء هبوطي، أربكت صخور شديدة الانعكاس رادار الهبوط، فلم تتوقف محركاتي الرئيسية عند الارتفاع الصحيح. ارتددت عن سطح القمر مرتين قبل أن أستقر هبوطاً ناعماً.","bounce bounced landing radar engine rocks descent ارتد هبوط رادار محرك"],
["📺","TV pictures","صور تلفزيونية","Less than an hour after landing I began transmitting thousands of TV pictures of the surrounding area. I carried a TV camera and a surface sampler.","بعد أقل من ساعة من الهبوط بدأت أرسل آلاف الصور التلفزيونية للمنطقة المحيطة. كنت أحمل كاميرا تلفزيونية وجهازاً لأخذ عينات السطح.","tv television picture photo camera images صور كاميرا"],
["🧱","Is the soil safe?","هل التربة آمنة؟","With my sampler I dug trenches and ran bearing tests. Scientists concluded the lunar soil was like wet sand, with enough bearing strength to support an Apollo lunar module.","بجهاز أخذ العينات حفرت خنادق وأجريت اختبارات التحمل. استنتج العلماء أن التربة القمرية تشبه الرمل الرطب وأنها قوية بما يكفي لتحمل مركبة أبولو القمرية.","soil sand wet trench bearing sampler safe dig تربة رمل حفر"],
["🤝","Apollo 12 visit","زيارة أبولو 12","On 19 November 1969, Apollo 12 astronauts Charles Conrad Jr. and Alan L. Bean landed the lunar module Intrepid about 180 metres from my inactive body. During their second moonwalk they walked over to me.","في 19 نوفمبر 1969 هبط رائدا أبولو 12 تشارلز كونراد وآلان بين بالمركبة القمرية إنتريبيد على بعد نحو 180 متراً من جسمي الخامل، وفي سيرهما الثاني على القمر مشيا إليّ.","apollo 12 visit conrad bean intrepid astronaut زيارة رواد"],
["🧰","Parts taken home","أجزاء عادت للأرض","The astronauts recovered parts of me, including my soil scoop and camera system, and brought them to Earth so scientists could evaluate the effects of long-term exposure on the lunar surface.","أخذ الروّاد أجزاء مني، منها مجرفة التربة ونظام الكاميرا، وأعادوها إلى الأرض ليقيّم العلماء أثر التعرض الطويل لسطح القمر.","parts scoop camera recovered brought earth exposure مجرفة أجزاء"],
["📅","Timeline","الجدول الزمني","Launched 17 April 1967, landed 20 April 1967, last contact 4 May 1967, and visited by Apollo 12 on 19 November 1969, more than two and a half years later.","أُطلقت 17 أبريل 1967، وهبطت 20 أبريل 1967، وآخر اتصال 4 مايو 1967، وزارها أبولو 12 في 19 نوفمبر 1969 بعد أكثر من سنتين ونصف.","timeline date when years launch last contact تاريخ جدول"],
["🎯","Mission goal","هدف المهمة","My objective was to achieve a soft landing on the Moon. I was built in the United States by NASA and JPL, and I weighed 2,200 pounds, about 997.9 kilograms.","كان هدفي تحقيق هبوط ناعم على القمر. صنعتني ناسا ومختبر JPL في الولايات المتحدة، وكانت كتلتي 2,200 رطل أي نحو 997.9 كغ.","goal objective nation usa jpl nasa mass weight هدف كتلة وزن"]],
falcon:[
["🚀","Two stages","المرحلتان","I am Falcon. My descent stage carried the astronauts to the lunar surface and remained there after the mission. My ascent stage returned them to lunar orbit before it was separated from the mission.","أنا فالكون. مرحلتي الهابطة حملت الروّاد إلى سطح القمر وبقيت هناك بعد المهمة، ومرحلتي الصاعدة أعادتهم إلى مدار القمر ثم انفصلت عن المهمة.","stage stages descent ascent two part مرحلة مرحلتان"],
["🚙","Lunar rover","المركبة الجوالة","Apollo 15 introduced the Lunar Roving Vehicle, an electric-powered vehicle. It let the astronauts explore areas farther from their landing site, carried scientific equipment and collected lunar samples. They travelled about 27.9 kilometres with it, and it was left on the Moon.","قدّمت أبولو 15 المركبة القمرية الجوالة، وهي مركبة تعمل بالكهرباء. مكّنت الروّاد من استكشاف مناطق أبعد عن موقع الهبوط، وحملت المعدات العلمية وجمعت العيّنات. قطع الروّاد بها نحو 27.9 كم، وتُركت على القمر.","rover lrv drive vehicle car kilometres مركبة جوالة سيارة"],
["🔬","ALSEP station","محطة ALSEP","Apollo 15 deployed ALSEP, an advanced science station that collected data about the Moon and transmitted it to Earth for long-term research. It began operating on 31 July 1971, and NASA officially shut the ALSEP stations down in September 1977.","نشرت أبولو 15 محطة ALSEP العلمية المتقدمة لجمع بيانات عن القمر وإرسالها إلى الأرض للبحث طويل الأمد. بدأت العمل في 31 يوليو 1971، وأوقفتها ناسا رسمياً في سبتمبر 1977.","alsep station science data محطة"],
["🧪","Seven experiments","التجارب السبع","ALSEP had seven experiments: a passive seismometer for moonquakes, a magnetometer for the Moon's magnetic field, a solar wind spectrometer, a suprathermal ion detector for energetic charged particles, a cold cathode ion gauge for gas density, a dust detector, and a heat flow experiment measuring heat moving from inside the Moon to its surface.","ضمّت المحطة سبع تجارب: مقياس زلازل سلبي لرصد الزلازل القمرية، ومقياس مغناطيسي لمجال القمر، ومطياف الرياح الشمسية، وكاشف الأيونات فوق الحرارية للجسيمات المشحونة النشطة، ومقياس أيونات بالمهبط البارد لكثافة الغازات، وكاشف الغبار، وتجربة تدفق الحرارة من باطن القمر إلى سطحه.","experiment seven seismometer magnetometer dust heat wind ion تجارب"],
["⚡","SNAP-27 power","مولّد SNAP-27","There is no regular power supply on the Moon, so ALSEP used the SNAP-27 generator. It converts heat from the natural radioactive decay of plutonium-238 into electricity, and it was designed to run for a long time without solar energy.","لا يوجد مصدر كهرباء منتظم على القمر، فاعتمدت المحطة على مولّد SNAP-27 الذي يحوّل حرارة التحلل الإشعاعي الطبيعي للبلوتونيوم-238 إلى كهرباء، وصُمم ليعمل طويلاً دون طاقة شمسية.","power snap generator plutonium electricity nuclear rtg طاقة كهرباء بلوتونيوم"],
["🗿","Fallen Astronaut","رائد الفضاء الساقط","Apollo 15 left a small aluminium sculpture called Fallen Astronaut, made by the Belgian artist Paul Van Hoeydonck. It shows a human figure lying on its back and was placed beside a plaque commemorating 14 American and Soviet astronauts and cosmonauts who died during space exploration.","تركت أبولو 15 منحوتة ألومنيوم صغيرة اسمها رائد الفضاء الساقط، صنعها الفنان البلجيكي بول فان هويدونك، وتمثل شخصاً مستلقياً على ظهره، ووُضعت بجانب لوحة تكرّم 14 رائد فضاء أمريكياً وسوفييتياً ماتوا أثناء استكشاف الفضاء.","fallen astronaut sculpture statue plaque art منحوتة تمثال"],
["🌙","Why Apollo 15","لماذا أبولو 15","Apollo 15 launched in July 1971 and marked an important step toward geological research, because the astronauts could explore a much wider area of the Moon.","أُطلقت أبولو 15 في يوليو 1971 وكانت خطوة مهمة نحو البحث الجيولوجي، إذ تمكّن الروّاد من استكشاف منطقة أوسع بكثير من القمر.","why apollo 15 geology launch 1971 جيولوجيا إطلاق"]],
viking:[
["🎯","Landing story","قصة الهبوط","The orbiter's photos showed my planned site was rougher than expected, so scientists retargeted me to the western slopes of Chryse Planitia. I separated from the orbiter at 08:32 UT and touched down at 11:53:06 UT on 20 July 1976, at 22.483 degrees north, 47.94 degrees west, about 28 kilometres from my planned target.","أظهرت صور المدارية أن موقعي المخطط وعر، فتغيّر هدفي إلى المنحدرات الغربية لسهل كريسي. انفصلت عن المدارية الساعة 08:32 بالتوقيت العالمي وهبطت 11:53:06 يوم 20 يوليو 1976 عند 22.483 شمالاً و47.94 غرباً، على بعد نحو 28 كم من هدفي المخطط.","land landing touch down site chryse target rough هبوط حط موقع"],
["📸","First photo","أول صورة","Minutes after landing I took the first photograph ever made on the surface of Mars. I shot high-quality images in three colours and a 300-degree panorama that showed parts of myself and the gently rolling plains. The landers returned 4,500 photos of the two landing sites.","بعد دقائق من الهبوط التقطت أول صورة في التاريخ من سطح المريخ. صورت بثلاثة ألوان وبانوراما بزاوية 300 درجة ظهر فيها جزء مني والسهول المتموجة. أرسلت الهابطتان 4,500 صورة للموقعين.","photo picture camera image panorama first صورة كاميرا بانوراما"],
["🔬","My instruments","أجهزتي","I carried seven instruments: two facsimile cameras, a gas chromatograph mass spectrometer, a seismometer, an X-ray fluorescence spectrometer, a biology laboratory, a weather package for temperature, pressure and wind, and a remote sampler arm. My seismometer was inoperable.","حملت سبعة أجهزة: كاميرتين، وجهاز GCMS، ومقياس زلازل، ومطياف أشعة سينية، ومختبر أحياء، وحزمة طقس للحرارة والضغط والرياح، وذراع جمع عينات. أما مقياس الزلازل فكان معطلاً.","instrument sensor science tools gcms spectrometer seismometer weather أجهزة"],
["🧬","Search for life","البحث عن حياة","On 28 July 1976 my robot arm scooped the first soil into my biology lab. Across four samples some data could be read as a weak positive for life, but the main test for organic compounds, sensitive down to 10 to 100 parts per billion, came back negative. The question stayed open.","في 28 يوليو 1976 جمعت ذراعي أول عينات التربة إلى مختبر الأحياء. في العينات الأربع بدت بعض البيانات إيجابية ضعيفة للحياة، لكن الاختبار الرئيسي للمركبات العضوية، بحساسية 10 إلى 100 جزء في المليار، كان سلبياً. وبقي السؤال مفتوحاً.","life alive biology organic microbe soil sample dig حياة عينات تربة"],
["🌡️","Weather and soil","الطقس والتربة","I recorded minus 86 degrees Celsius before dawn and minus 33 in the afternoon. My data showed an abundance of sulfur, different from any known material on Earth or the Moon. Later I sent daily, then weekly, weather reports as part of the Viking Monitor Mission.","سجلت -86 درجة مئوية قبل الفجر و-33 عصراً. وأظهرت بياناتي وفرة من الكبريت، تختلف عن أي مادة معروفة على الأرض أو القمر. وبعدها أرسلت تقارير طقس يومية ثم أسبوعية ضمن مهمة المراقبة.","weather temperature cold wind pressure sulfur sulphur طقس حرارة كبريت رياح"],
["⚡","Power","الطاقة","Each lander carried two SNAP-19 radioisotope thermoelectric generators, nuclear power units under the wind covers on my back. They kept me working for more than six years.","حملت كل هابطة مولّدين نوويين من طراز SNAP-19 تحت غطاءي الرياح على ظهري، وبقيت أعمل بهما أكثر من ست سنوات.","power energy battery nuclear rtg electricity طاقة بطارية نووي"],
["📅","Timeline","الجدول الزمني","Launched 20 August 1975, orbit 19 June 1976, landing 20 July 1976. The primary mission ended in November 1976, then came the Extended Mission to May 1978 and the Continuation Mission to July 1979. In January 1982 I was renamed the Thomas Mutch Memorial Station, honouring the leader of the imaging team, who died in 1980.","أُطلقت 20 أغسطس 1975، ودخلت المدار 19 يونيو 1976، وهبطت 20 يوليو 1976. انتهت المهمة الأساسية في نوفمبر 1976، ثم المهمة الممددة حتى مايو 1978 ومهمة الاستمرار حتى يوليو 1979. وفي يناير 1982 سُمّيت محطة توماس ماتش التذكارية تكريماً لقائد فريق التصوير الذي توفي عام 1980.","timeline date when years mission phases extended mutch name memorial تاريخ جدول اسم"],
["🆚","Mars 3","مارس 3","The Soviet Mars 3 lander made a survivable landing in 1971, a technical first, but contact was lost seconds after touchdown. That is why I am called the first truly successful landing on Mars.","هبطت المركبة السوفييتية مارس 3 عام 1971 هبوطاً نجت منه، وهو سبق تقني، لكن الاتصال انقطع بعد ثوانٍ. لذلك أُعدّ أول هبوط ناجح فعلاً على المريخ.","mars 3 soviet russia first usa سوفييت روسيا"]],

["🔋","Launch swap","تبديل قبل الإطلاق","Before launch the batteries of the first spacecraft were discharged, so NASA replaced it with the second spacecraft, which flew as Viking 1. We launched on 20 August 1975 at 21:22 UT on a Titan IIIE-Centaur from Cape Canaveral.","قبل الإطلاق كانت بطاريات المركبة الأولى مفرغة، فاستبدلتها ناسا بالثانية التي أُطلقت باسم فايكنغ 1. أُطلقنا في 20 أغسطس 1975 الساعة 21:22 بصاروخ Titan IIIE-Centaur من كيب كانافيرال.","launch battery swap titan rocket cape إطلاق بطارية صاروخ"],

ce Museum that runs in the browser: fly a spaceship to the Moon or Mars, walk among five real machines, and open each one to see its model and NASA photos and talk with it through ready-made questions."],["Inside every machine","A spoken timeline that changes the model at each step; the mission file in numbers; \"If we lived here\", about how it helps us today and how it would help if people decided to live on the Moon or Mars; and a short game based on its real story."],["Accessibility","At the start you choose what fits you: a spoken guide for blind visitors, written text and a visible arrow for deaf visitors, one-switch play and slower games for limited movement, a dyslexia font and simpler words, and a safe mode with no flashing. Settings add high contrast, colour-blind colours, reduced motion and larger text. The whole museum is in Arabic and English."],["Trust","The facts come from NASA pages, and the source is shown under the answers. Future ideas are labelled as ideas to imagine, not NASA plans, and weather and distance figures are labelled as approximate."],["The challenge","NASA Space Apps Challenge 2026: NASA's Discarded Equipment Storytelling."],["Sources and thanks","NASA pages: Viking 1, Viking: 50 Years on Mars, Ingenuity and its articles, Surveyor 3, and NSSDCA for Apollo 15. Photos from these pages and the NASA Image and Video Library. Models and textures (spaceship, cockpit, Moon, Mars, Earth, astronaut suit, Apollo lunar module) were supplied by the team. AI use: the code was written with the help of an AI assistant (Claude by Anthropic), and the recorded voices are AI-generated (ElevenLabs)."]];
